---
# Filesystem layout for the garmin-mcp service on the box.
app_prefix: /opt/garmin-mcp
app_bin_dir: "{{ app_prefix }}/bin"
app_etc_dir: /etc/garmin-mcp

# garmin service. Single-user: one deployment serves one linked Garmin account,
# gated by a single shared bearer token (MCP_BEARER_TOKEN).
garmin_service_user: garmin
garmin_listen_addr: "127.0.0.1:8082"
# State directory + token store (the garmin user owns these; the OAuth tokens
# minted by the human-gated `garmin login` bootstrap persist here, 0600).
garmin_state_dir: /var/lib/garmin-mcp
garmin_token_path: "{{ garmin_state_dir }}/garmin-tokens.json"

# Secrets resolve from vault (group_vars/all/vault.yml):
#   mcp_bearer_token -> vault_mcp_bearer_token
