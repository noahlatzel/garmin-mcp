name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt (fail on diff)
        run: |
          diff=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$diff" ]; then
            echo "gofmt needed on:" >&2
            echo "$diff" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: go test
        run: go test -race ./...

      - name: docker build
        run: docker build -t ci .
